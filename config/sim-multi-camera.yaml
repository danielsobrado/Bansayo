# Twelve simulated trackers plus four simulated cameras around the subject for multi-camera
# triangulation. Camera intrinsics and extrinsics are declared by the simulator from this file.
schema_version: 1
engine:
  publish_rate_hz: 60
  stale_after_ms: 250
  data_dir: ./data
api:
  bind: 127.0.0.1:7700
assignments:
  SIM-T01: pelvis
  SIM-T02: chest
  SIM-T03: left_thigh
  SIM-T04: left_shin
  SIM-T05: right_thigh
  SIM-T06: right_shin
  SIM-T07: left_foot
  SIM-T08: right_foot
  SIM-T09: left_upper_arm
  SIM-T10: left_forearm
  SIM-T11: right_upper_arm
  SIM-T12: right_forearm
triangulation:
  max_skew_ms: 20
  max_reprojection_error_px: 15.0
  min_views: 2
  min_ray_angle_deg: 3.0
sources:
  - id: sim
    kind: simulated
    enabled: true
    seed: 42
    motion: standing
    speed: 1.0
    trackers:
      - { id: SIM-T01, rate_hz: 100, noise_deg: 0.2 }
      - { id: SIM-T02, rate_hz: 100, noise_deg: 0.2 }
      - { id: SIM-T03, rate_hz: 100, noise_deg: 0.2 }
      - { id: SIM-T04, rate_hz: 100, noise_deg: 0.2 }
      - { id: SIM-T05, rate_hz: 100, noise_deg: 0.2 }
      - { id: SIM-T06, rate_hz: 100, noise_deg: 0.2 }
      - { id: SIM-T07, rate_hz: 100, noise_deg: 0.2 }
      - { id: SIM-T08, rate_hz: 100, noise_deg: 0.2 }
      - { id: SIM-T09, rate_hz: 100, noise_deg: 0.2 }
      - { id: SIM-T10, rate_hz: 100, noise_deg: 0.2 }
      - { id: SIM-T11, rate_hz: 100, noise_deg: 0.2 }
      - { id: SIM-T12, rate_hz: 100, noise_deg: 0.2 }
    cameras:
      - id: SIM-CAM1                  # front, chest height
        rate_hz: 30
        resolution_px: [1280, 720]
        fov_y_deg: 50
        position_m: [0.0, 1.2, 3.2]
        look_at_m: [0.0, 1.0, 0.0]
        noise_px: 1.5
      - id: SIM-CAM2                  # right side, raised
        rate_hz: 30
        resolution_px: [1280, 720]
        fov_y_deg: 50
        position_m: [3.0, 1.6, 0.4]
        look_at_m: [0.0, 1.0, 0.0]
        noise_px: 1.5
      - id: SIM-CAM3                  # behind, low
        rate_hz: 30
        resolution_px: [1280, 720]
        fov_y_deg: 50
        position_m: [-0.6, 0.9, -3.1]
        look_at_m: [0.0, 1.0, 0.0]
        noise_px: 1.5
      - id: SIM-CAM4                  # left side, high
        rate_hz: 30
        resolution_px: [1280, 720]
        fov_y_deg: 50
        position_m: [-3.1, 2.0, 0.8]
        look_at_m: [0.0, 1.0, 0.0]
        noise_px: 1.5
