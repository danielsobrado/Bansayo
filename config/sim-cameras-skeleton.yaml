# Four simulated cameras and no trackers: the skeleton and joint angles come from the
# camera-only fit to triangulated landmarks (no IMU, no mounting calibration).
schema_version: 1
engine:
  publish_rate_hz: 60
  stale_after_ms: 250
  data_dir: ./data
api:
  bind: 127.0.0.1:7700
triangulation:
  max_skew_ms: 20
  max_reprojection_error_px: 15.0
  min_views: 2
  min_ray_angle_deg: 3.0
sources:
  - id: sim
    kind: simulated
    enabled: true
    seed: 42
    motion: squat
    speed: 1.0
    trackers: []
    cameras:
      - id: SIM-CAM1                  # front, chest height
        rate_hz: 30
        resolution_px: [1280, 720]
        fov_y_deg: 50
        position_m: [0.0, 1.2, 3.2]
        look_at_m: [0.0, 1.0, 0.0]
        noise_px: 1.5
      - id: SIM-CAM2                  # right side, raised
        rate_hz: 30
        resolution_px: [1280, 720]
        fov_y_deg: 50
        position_m: [3.0, 1.6, 0.4]
        look_at_m: [0.0, 1.0, 0.0]
        noise_px: 1.5
      - id: SIM-CAM3                  # behind, low
        rate_hz: 30
        resolution_px: [1280, 720]
        fov_y_deg: 50
        position_m: [-0.6, 0.9, -3.1]
        look_at_m: [0.0, 1.0, 0.0]
        noise_px: 1.5
      - id: SIM-CAM4                  # left side, high
        rate_hz: 30
        resolution_px: [1280, 720]
        fov_y_deg: 50
        position_m: [-3.1, 2.0, 0.8]
        look_at_m: [0.0, 1.0, 0.0]
        noise_px: 1.5
