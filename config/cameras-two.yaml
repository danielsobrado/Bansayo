# Physical USB cameras, 2D pose inference and triangulation; no trackers.
# `python scripts/setup.py` installs the models and ONNX Runtime; `python scripts/setup.py cameras`
# writes config/local-cameras.yaml from this file with one entry per attached camera.
# Calibrate with scripts/calibrate_cameras.py before 3D landmarks appear (README, "Attach
# physical cameras"). Up to MAX_CAMERAS (8) entries; three or four need no other change.
schema_version: 1
engine:
  publish_rate_hz: 60
  stale_after_ms: 250
  data_dir: ./data
api:
  bind: 127.0.0.1:7700
triangulation:
  # Cameras are interpolated to one instant; a camera takes part while its newest frame is
  # within this of the newest overall. Keep it above one frame period (33 ms at 30 Hz).
  max_skew_ms: 40
  max_reprojection_error_px: 15.0
  min_views: 2
  min_ray_angle_deg: 3.0
sources:
  - id: cams
    kind: camera
    models_dir: ./models
    execution: auto          # DirectML on Windows when available, else CPU; or `cpu`
    min_person_score: 0.5
    min_keypoint_score: 0.3
    cameras:
      - { id: CAM-FRONT, device: 0, resolution_px: [1280, 720], rate_hz: 30 }
      - { id: CAM-SIDE, device: 1, resolution_px: [1280, 720], rate_hz: 30 }
