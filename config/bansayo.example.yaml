# Kinexa simulated reference configuration. All paths are relative to the process working directory.
# For the twelve-tracker demonstration use sim-full-body.yaml; for minimal inputs use
# sim-six-trackers.yaml or sim-camera-only.yaml.
schema_version: 1
engine:
  publish_rate_hz: 60            # Solve/publication rate, independent of source output rates.
  stale_after_ms: 250            # Older readings no longer drive segment rotations.
  data_dir: ./data               # Calibration, assignment overrides and recorded MCAP sessions.
api:
  bind: 127.0.0.1:7700           # Local-only by default; other bind addresses log a warning.
  allowed_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - tauri://localhost
    - http://tauri.localhost
logging:
  level: info                   # trace | debug | info | warn | error; RUST_LOG overrides this.
  format: pretty                # pretty | json
skeleton:
  model: kinexa.body.v1
  height_m: 1.75                # Default proportions are assumed, never labelled calibrated.
assignments:
  SIM-T01: pelvis
  SIM-T02: left_thigh
  SIM-T03: left_shin
quality:
  degraded_rate_fraction: 0.7
  degraded_quality: 0.5
  disconnect_after_ms: 1000
sources:
  - id: sim
    kind: simulated
    enabled: true
    seed: 42                    # Same seed/device/sequence reproduces mounting and noise.
    motion: standing            # Select reference_pose before mounting capture.
    speed: 1.0                  # Simulation speed >0 and <=10; pausing holds motion, not telemetry.
    trackers:
      - { id: SIM-T01, rate_hz: 100, noise_deg: 0.2, heading_offset_deg: 0 }
      - { id: SIM-T02, rate_hz: 100, noise_deg: 0.2, heading_offset_deg: 0 }
      - { id: SIM-T03, rate_hz: 100, noise_deg: 0.2, heading_offset_deg: 0 }
    cameras:
      - id: SIM-CAM1
        rate_hz: 30
        resolution_px: [1280, 720]
        fov_y_deg: 50
        position_m: [0.0, 1.2, 3.2]
        look_at_m: [0.0, 1.0, 0.0]
        noise_px: 1.5
    # Optional repeating fault demonstration, driven by simulation time.
    # Manual fault actions override scripted state for that device until engine restart.
    scenario_period_s: 60
    scenario:
      - { at_s: 20, device: SIM-T03, action: disconnect }
      - { at_s: 26, device: SIM-T03, action: reconnect }
      - { at_s: 34, device: SIM-T02, action: degrade, quality: 0.3 }
      - { at_s: 42, device: SIM-T02, action: restore }
