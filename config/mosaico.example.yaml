# Copy to config/local-mosaico.yaml and replace the MAC with the station MAC
# printed by the firmware. Keep the HTTP API local; the UDP port is independent.
schema_version: 2
engine:
  publish_rate_hz: 120
  stale_after_ms: 250
  data_dir: ./data
diagnostics:
  timing: true
  resources: true
  reliability: false # Opt in to persistent device status history when needed.
tracking:
  mode: imu_only
sources:
  - id: mosaico
    kind: esp32_udp
    enabled: true
    bind: "0.0.0.0:7710"
    rate_hz: 200
    latency_ms: 0
    trackers:
      - id: MOSAICO-01
        tracker: "AA:BB:CC:DD:EE:FF/0"
assignments:
  MOSAICO-01: right_shin
