name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes the contract checks: checked-in TypeScript and golden JSON must match the Rust types.
      - run: cargo test --workspace
      - run: node scripts/verify-gate1.mjs
      - run: node scripts/verify-gate2.mjs

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm test
      # Type-checks, then builds.
      - run: npm run build

  # VR client headless smokes. No OpenXR runtime or headset: geometry, wire shape and the desktop
  # fallback only. clinic_smoke and pose_mirror_smoke are not run: they already fail on main
  # (92f159e) and are tracked separately.
  vr:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.5.1-stable
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot (pinned)
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --version
      - run: godot --headless --path apps/vr --editor --quit
      - run: godot --headless --path apps/vr --xr-mode off --script tests/contract_smoke.gd
      - run: godot --headless --path apps/vr --xr-mode off --script tests/spatial_ui_smoke.gd
      - run: godot --headless --path apps/vr --xr-mode off --script tests/xr_observation_smoke.gd

  firmware-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S firmware/common/tests -B firmware/common/tests/build
      - run: cmake --build firmware/common/tests/build
      - run: ctest --test-dir firmware/common/tests/build --output-on-failure
