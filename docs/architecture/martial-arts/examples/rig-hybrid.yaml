# ILLUSTRATIVE — not loadable by the current engine build.
# Hybrid rig: three cameras, printed tag clusters on pelvis and thighs, IMUs on pelvis, thighs and shins.
# Thighs carry both a cluster and an IMU: the cluster corrects the IMU's heading (08 §7.2).
schema_version: 2

engine:
  publish_rate_hz: 120
  stale_after_ms: 250
  data_dir: ./data

api:
  bind: 127.0.0.1:7700

skeleton:
  model: bansayo.body.v1
  height_m: 1.75

content:
  dirs: [./content]

# Tracking quality settings. `profile_override` may only lower the discovered profile.
tracking:
  profile_override: null
  analysis_rate_hz: null

sources:
  - id: cam-front
    kind: camera
    enabled: true
    device: "USB Camera (046d:085c)"
    transport: usb
    resolution_px: [1920, 1080]
    rate_hz: 60
    pixel_format: mjpeg
    exposure_s: 0.002
    latency_ms: 40
    processing_profile: body-halpe26
    fiducials: true
    record_video: false
  - id: cam-left
    kind: camera
    enabled: true
    device: "USB Camera (046d:08e5)"
    transport: usb
    resolution_px: [1920, 1080]
    rate_hz: 60
    pixel_format: mjpeg
    exposure_s: 0.002
    latency_ms: 40
    processing_profile: body-halpe26
    fiducials: true
    record_video: false
  - id: cam-right
    kind: camera
    enabled: true
    device: "USB Camera (0c45:6366)"
    transport: usb
    resolution_px: [1920, 1080]
    rate_hz: 60
    pixel_format: mjpeg
    exposure_s: 0.002
    latency_ms: 40
    processing_profile: body-halpe26
    fiducials: true
    record_video: false
  - id: trackers
    kind: esp32_udp
    enabled: true
    bind: 0.0.0.0:6970
    output_rate_hz: 200
  - id: vr-xr
    kind: client_ingest
    enabled: false

processing_profiles:
  body-halpe26:
    detector: { model_path: models/yolox-m-humanart.onnx, every_frames: 10, score_min: 0.5 }
    pose:
      model_id: rtmpose-m-halpe26
      model_path: models/rtmpose-m-halpe26.onnx
      landmark_schema: halpe26
      keypoint_score_min: 0.3
    execution: [cuda, directml, cpu]
    max_inference_hz: 180

fiducials:
  families: [tag36h11]
  tag36h11: { max_hamming: 1, min_decision_margin: 30 }
  min_contrast: 40
  quad_decimate: 1.0

trackables:
  - id: PLATE-PELVIS
    kind: marker_cluster
    enabled: true
    model: plate2-80
    family: tag36h11
    tags: [100, 101]
    edge_mm_measured: 80.1
  - id: CUFF-L-THIGH
    kind: marker_cluster
    enabled: true
    model: cuff3-60
    family: tag36h11
    tags: [110, 111, 112]
    edge_mm_measured: 60.2
  - id: CUFF-R-THIGH
    kind: marker_cluster
    enabled: true
    model: cuff3-60
    family: tag36h11
    tags: [113, 114, 115]
    edge_mm_measured: 60.2

# One orientation device per segment is the existing rule for IMUs. A cluster and an IMU may share a segment.
assignments:
  PLATE-PELVIS: pelvis
  CUFF-L-THIGH: left_thigh
  CUFF-R-THIGH: right_thigh
  ESP-A4CF12B301: pelvis
  ESP-A4CF12B302: left_thigh
  ESP-A4CF12B303: left_shin
  ESP-A4CF12B304: right_thigh
  ESP-A4CF12B305: right_shin

quality:
  degraded_rate_fraction: 0.7
  degraded_quality: 0.5
  disconnect_after_ms: 1000

triangulation:
  mode: aligned              # requires valid time_sync profiles; otherwise the engine falls back to gated
  align_exact_ms: 2
  max_skew_ms: 20
  max_reprojection_error_px: 15.0
  min_views: 2
  min_ray_angle_deg: 3.0
  error_space: pixels

gates:
  max_speed_m_s: { default: 15, wrist: 30, ankle: 30, toe: 30, heel: 30 }
  bone_length_tolerance: 0.25
  floor_tolerance_m: 0.05

fusion:
  skeleton_fit: true
  heading_correction: true
  heading_tau_s: 5
  heading_valid_s: 10
  heading_reacquire_deg: 60
  heading_reacquire_s: 2

evidence:
  detector_noise_floor_px: 2.0
  sync_sigma_ms: 4
  imu: { tilt_sigma_rad: 0.035, heading_sigma0_rad: 0.05, heading_drift_rad_s: 0.0017 }

analysis:
  filters: { position_hz: 12, angle_hz: 12 }
  planar_camera: auto

recognition:
  accept_confidence: { free: 0.75, guided: 0.5 }
  ambiguity_margin: 0.10

training:
  countdown_s: 5
  pause_after_tracking_loss_ms: 3000
  limits: { strikes_per_session: 400, session_minutes: 90 }

calibration:
  intrinsics_max_rms_px: 0.6
  extrinsics_max_rms_px: 1.0
  mounting_max_age_s: 14400
  heading_max_age_s: 1800
  qa_max_age_h: 24

markers:
  geometry_max_rms_mm: 1.5
  mounting_disagreement_rad: 0.26

storage:
  retention: { inputs_days: 90, motion_days: 365, video_days: 14 }
  record_defaults: { inputs: true, motion: true, video: false }
