[package]
name = "kinexa-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
kinexa-engine = { path = "../../../crates/kinexa-engine" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
