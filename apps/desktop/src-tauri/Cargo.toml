[package]
name = "bansayo-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
bansayo-engine = { path = "../../../crates/bansayo-engine" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }

# Same as the workspace root: full debug info for the hosted engine exhausted memory when
# several binaries linked it in parallel on Windows (LNK1102).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Unoptimised MJPEG decoding capped a 30 fps webcam at 7-10 fps in debug builds (root Cargo.toml).
[profile.dev.package.zune-jpeg]
opt-level = 3
