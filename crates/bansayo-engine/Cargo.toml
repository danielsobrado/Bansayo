[package]
name = "bansayo-engine"
description = "Bansayo tracking engine: sources, pipeline, calibration and local API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bansayo-contracts.workspace = true
bansayo-training.workspace = true
mcap.workspace = true
bytes.workspace = true
axum.workspace = true
clap.workspace = true
futures-util.workspace = true
humantime.workspace = true
nalgebra.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ort.workspace = true
image.workspace = true
rusqlite.workspace = true

[target.'cfg(windows)'.dependencies]
nokhwa.workspace = true
# ADR-020 fallback for manual exposure and gain; the same version nokhwa already builds.
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_Media_DirectShow", "Win32_System_Com"] }
ort = { workspace = true, features = ["directml"] }

[dev-dependencies]
http-body-util.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
tower.workspace = true
