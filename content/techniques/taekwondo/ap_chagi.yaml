# Front kick. Authored for active side = left; mirrored for the right side (05 §3).
# Thresholds are initial detection values, deliberately wide. They are not statements of
# correct technique. The thigh-azimuth bound separates it from the roundhouse kick.
schema: bansayo.technique/v1
id: taekwondo.ap_chagi
version: 1
status: draft
names:
  display: Front kick
  native: Ap chagi
  aliases: [front snap kick]
discipline: taekwondo
style: kukkiwon
family: kick.front
kind: dynamic
sides: [left, right]
active_limb: leg
mirror_signed: true
instructions:
  - instr.kick.clear_space
  - instr.taekwondo.fighting_stance
  - instr.kick.rear_leg_kicks

segmentation:
  driver: ankle_speed.active
  unit: leg_length_s
  start_above: 1.2
  end_below: 0.5
  min_ms: 250
  max_ms: 2500

phases:
  - id: chamber
    label: Chamber
    enter:
      all:
        - { obs: knee_height.active, op: rises_above, value: 0.20, unit: leg_length, ref: rest }
    max_ms: 900

  - id: extension
    label: Extension
    enter:
      all:
        - { obs: knee_extension_rate.active, op: gt, value: 3.0, unit: rad_s, hold_ms: 20 }
        - { obs: thigh_elevation.active, op: gt, value: 0.90, unit: rad }
        - { obs: thigh_azimuth.active, op: lt, value: 0.60, unit: rad }
    max_ms: 700

  - id: retraction
    label: Retraction
    enter:
      all:
        - { obs: knee_extension_rate.active, op: lt, value: -2.0, unit: rad_s, hold_ms: 20 }
    max_ms: 700

  - id: recovery
    label: Recovery
    enter:
      all:
        - { obs: ankle_height.active, op: falls_below, value: 0.15, unit: leg_length, ref: rest }
    max_ms: 1200

strike:
  obs: ankle_speed.active
  op: local_max
  unit: leg_length_s
  prominence: 1.0
  in_phase: extension
  keypoint: ankle.active

complete:
  all:
    - { obs: ankle_height.active, op: lt, value: 0.10, unit: leg_length, ref: rest, hold_ms: 100 }
    - { obs: ankle_speed.active, op: lt, value: 0.5, unit: leg_length_s }

required_observables:
  - knee_height.active
  - ankle_height.active
  - ankle_speed.active
  - knee_flexion.active
  - knee_extension_rate.active
  - thigh_elevation.active
  - thigh_azimuth.active

optional_observables:
  - knee_flexion.support
  - guard_distance.lead
  - guard_distance.rear

confusable_with:
  - taekwondo.dollyeo_chagi

metrics:
  - use: kick.total_time
  - use: kick.extension_time
  - use: kick.retraction_time
  - use: kick.peak_knee_height
  - use: kick.peak_ankle_height
  - use: kick.peak_ankle_speed
  - use: kick.support_knee_range
  - use: kick.guard_at_strike

scoring: scoring.kick.basic

cues:
  - id: guard_dropped
    category: guard
    basis: measurement
    when: { component: guard, below: 0.5 }
    priority: 1
    min_grade: A
    observed: cue.kick.guard.observed
    suggestion: cue.kick.guard.suggestion
    focus: external

target:
  level: middle
  distance: 0.95
  unit: leg_length
  radius_m: 0.15

tempo:
  slow_scale: 0.5

max_gap_ms: 80

safety:
  notes:
    - safety.kick.warm_up_first
    - safety.kick.no_physical_target
    - safety.kick.control_extension
  min_clear_radius_m: 2.0
  max_reps_per_set: 20
  max_sets_per_session: 8
  warmup_required: true
