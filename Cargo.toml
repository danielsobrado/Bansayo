[workspace]
members = ["crates/*"]
exclude = ["apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
bansayo-contracts = { path = "crates/bansayo-contracts" }
bansayo-training = { path = "crates/bansayo-training" }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
humantime = "2"
nalgebra = "0.35"
rand = { version = "0.9", default-features = false }
rand_chacha = { version = "0.9", default-features = false }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize", "serialize"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
http-body-util = "0.1"
tempfile = "3"
tokio-tungstenite = "0.29"
# FlatBuffers runtime for the SolarXR protocol (SlimeVR, ADR-022); official, no transitive deps of note.
flatbuffers = "25.12.19"
bytes = "1"
mcap = { version = "0.26", default-features = false, features = ["zstd"] }
tower = { version = "0.5", features = ["util"] }
# Analytics store (martial-arts ADR-029): SQLite compiled in, no system library.
rusqlite = { version = "0.37", features = ["bundled"] }
# Camera path: ONNX Runtime (onnxruntime.dll loaded at run time, see models/README.md), image
# codecs, capture.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-24"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
nokhwa = { version = "0.10", default-features = false, features = ["input-msmf"] }

# Parallel builds on Windows: with full debug info the engine library was ~460 MB (most of it
# debug info for dependency code instantiated inside it), and 24 test binaries linking it at once
# exhausted memory (LNK1102, then "can't find crate"). Line tables keep file and line numbers in
# backtraces; set `CARGO_PROFILE_DEV_DEBUG=full` for a debugger session that inspects variables.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Unoptimised MJPEG decoding capped a 30 fps webcam at 7-10 fps in debug builds (18 Nov 2026).
[profile.dev.package.zune-jpeg]
opt-level = 3
